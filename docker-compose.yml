# Local development only. Replace every password before any shared or production use.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tastybites
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: tastybites
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tastybites"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://tastybites:${DB_PASSWORD}@db:5432/tastybites?sslmode=disable
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      PUBLIC_MINIAPP_URL: ${PUBLIC_MINIAPP_URL:-http://localhost:5173}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports: ["8080:8080"]
volumes: { pgdata: {} }
